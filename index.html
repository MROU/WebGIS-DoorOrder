<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木门订单分布与空间调度平台</title>

    <!-- ==================== 第三方 CSS ==================== -->
    <!-- Leaflet 核心样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MarkerCluster 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Leaflet.draw 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <style>
        /* ----- 全局重置 & 布局 ----- */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: "Microsoft YaHei", sans-serif; 
        }
        
        #container { 
            display: flex; 
            height: 100%; 
        }
        
        #map { 
            flex: 1; 
            height: 100%; 
        }
        
        #sidebar { 
            width: 400px; 
            background: #f5f7fa; 
            padding: 15px; 
            box-sizing: border-box; 
            overflow-y: auto; 
        }

        /* ----- 侧边栏图表面板 ----- */
        .panel {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .panel h3 { 
            margin: 0 0 10px 0; 
            font-size: 16px; 
            color: #333; 
        }
        
        #statusChart, #cityChart { 
            width: 100%; 
            height: 220px; 
        }

        /* ----- 高亮标记动画 ----- */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 79, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 79, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 79, 0); }
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 地图区域 -->
        <div id="map"></div>
        
        <!-- 侧边栏图表区域 -->
        <div id="sidebar">
            <div class="panel">
                <h3>📊 订单状态分布</h3>
                <div id="statusChart"></div>
            </div>
            <div class="panel">
                <h3>🏙️ 各城市订单量</h3>
                <div id="cityChart"></div>
            </div>
        </div>
    </div>

    <!-- ==================== 第三方 JS 库 ==================== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <!-- ==================== 业务逻辑 ==================== -->
    <script>
        /* =====================================================================
           1. 全局配置与初始化
           ===================================================================== */
        
        // Leaflet.draw 中文本地化
        L.drawLocal = {
            draw: {
                toolbar: {
                    actions: { title: '取消绘制', text: '取消' },
                    finish: { title: '完成绘制', text: '完成' },
                    undo: { title: '删除最后绘制的点', text: '撤销' },
                    buttons: {
                        polyline: '绘制折线', polygon: '绘制多边形', rectangle: '绘制矩形',
                        circle: '绘制圆形', marker: '添加标记', circlemarker: '添加圆形标记'
                    }
                },
                handlers: {
                    circle: { tooltip: { start: '点击并拖动绘制圆形。', cont: '点击继续绘制圆形。' }, radius: '半径' },
                    circlemarker: { tooltip: { start: '点击放置圆形标记。' } },
                    marker: { tooltip: { start: '点击放置标记。' } },
                    polygon: { tooltip: { start: '点击开始绘制形状。', cont: '点击继续绘制形状。', end: '点击第一个点闭合形状。' } },
                    polyline: {
                        error: '错误: 形状边不能交叉!',
                        tooltip: { start: '点击开始绘制线条。', cont: '点击继续绘制线条。', end: '点击最后一个点结束线条。' }
                    },
                    rectangle: { tooltip: { start: '点击并拖动绘制矩形。' } },
                    simpleshape: { tooltip: { end: '松开鼠标完成绘制。' } }
                }
            },
            edit: {
                toolbar: {
                    actions: {
                        save: { title: '保存更改', text: '保存' },
                        cancel: { title: '取消编辑，放弃所有更改', text: '取消' },
                        clearAll: { title: '清除所有绘制的图形', text: '清除全部' }
                    },
                    buttons: {
                        edit: '编辑图形', editDisabled: '没有可编辑的图形',
                        remove: '删除图形', removeDisabled: '没有可删除的图形'
                    }
                },
                handlers: {
                    edit: { tooltip: { text: '拖动顶点或标记来编辑图形。', subtext: '点击取消放弃更改。' } },
                    remove: { tooltip: { text: '点击图形以删除。' } }
                }
            }
        };

        // 订单状态颜色映射
        const statusColors = {
            '待安装': '#ff4d4f',
            '已派单': '#faad14',
            '安装中': '#1890ff',
            '已完成': '#52c41a'
        };

        // 初始化地图
        const map = L.map('map').setView([34.0, 108.0], 5);
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            subdomains: ['1', '2', '3', '4'],
            attribution: '© 高德地图'
        }).addTo(map);

        // 初始化事件总线
        const EventBus = {
            events: {},
            on(event, handler) { (this.events[event] = this.events[event] || []).push(handler); },
            emit(event, payload) { (this.events[event] || []).forEach(h => h(payload)); }
        };


        /* =====================================================================
           2. 数据准备 (行政区划 & 模拟订单)
           ===================================================================== */
        
        // 加载中国行政区划
        fetch('./china.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: { color: '#3388ff', weight: 1, fillColor: '#e6f2ff', fillOpacity: 0.3 },
                    onEachFeature: function(feature, layer) {
                        layer.on({
                            mouseover: (e) => e.target.setStyle({ fillOpacity: 0.6 }),
                            mouseout: (e) => e.target.setStyle({ fillOpacity: 0.3 })
                        });
                        layer.bindPopup(`<b>${feature.properties.name}</b>`);
                    }
                }).addTo(map);
            });

        // 模拟生成订单数据
        function generateOrders(count) {
            const orders = [];
            const cities = [
                { name: '北京', lat: 39.9042, lng: 116.4074 }, { name: '上海', lat: 31.2304, lng: 121.4737 },
                { name: '广州', lat: 23.1291, lng: 113.2644 }, { name: '深圳', lat: 22.5431, lng: 114.0579 },
                { name: '成都', lat: 30.5728, lng: 104.0668 }, { name: '武汉', lat: 30.5928, lng: 114.3055 },
                { name: '西安', lat: 34.3416, lng: 108.9398 }, { name: '杭州', lat: 30.2741, lng: 120.1551 },
                { name: '南京', lat: 32.0603, lng: 118.7969 }, { name: '重庆', lat: 29.5630, lng: 106.5516 }
            ];
            const doorTypes = ['实木门', '复合门', '模压门', '钢木门', '原木门'];
            const statuses = ['待安装', '已派单', '安装中', '已完成'];

            for (let i = 0; i < count; i++) {
                const city = cities[Math.floor(Math.random() * cities.length)];
                const lat = city.lat + (Math.random() - 0.5) * 1.5;
                const lng = city.lng + (Math.random() - 0.5) * 1.5;
                
                orders.push({
                    id: `ORD-${String(i + 1).padStart(4, '0')}`,
                    customer: `客户${i + 1}`,
                    phone: `138${String(Math.floor(Math.random() * 100000000)).padStart(8, '0')}`,
                    city: city.name,
                    address: `${city.name}市某小区${Math.floor(Math.random() * 100)}栋`,
                    doorType: doorTypes[Math.floor(Math.random() * doorTypes.length)],
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    lat: lat,
                    lng: lng,
                    orderDate: `2024-${String(Math.floor(Math.random() * 12) + 1).padStart(2, '0')}-${String(Math.floor(Math.random() * 28) + 1).padStart(2, '0')}`
                });
            }
            return orders;
        }

        const orders = generateOrders(100);

        // 用 MarkerCluster 加载订单点
        const markers = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 50,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 12
        });

        orders.forEach(order => {
            const icon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    background-color: ${statusColors[order.status]};
                    width: 12px; height: 12px;
                    border-radius: 50%;
                    border: 2px solid #fff;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                "></div>`,
                iconSize: [12, 12]
            });

            const marker = L.marker([order.lat, order.lng], { icon: icon });
            
            // 绑定弹窗
            marker.bindPopup(`
                <div style="font-family: 'Microsoft YaHei'; min-width: 200px;">
                    <h4 style="margin: 0 0 8px 0; color: #1890ff;">${order.id}</h4>
                    <p style="margin: 4px 0;"><b>客户：</b>${order.customer}</p>
                    <p style="margin: 4px 0;"><b>电话：</b>${order.phone}</p>
                    <p style="margin: 4px 0;"><b>城市：</b>${order.city}</p>
                    <p style="margin: 4px 0;"><b>地址：</b>${order.address}</p>
                    <p style="margin: 4px 0;"><b>门型：</b>${order.doorType}</p>
                    <p style="margin: 4px 0;"><b>状态：</b><span style="color: ${statusColors[order.status]}; font-weight: bold;">${order.status}</span></p>
                    <p style="margin: 4px 0;"><b>下单日期：</b>${order.orderDate}</p>
                </div>
            `);

            // 触发事件总线
            marker.on('click', () => EventBus.emit('order-click', order));
            markers.addLayer(marker);
        });
        map.addLayer(markers);


        /* =====================================================================
           3. ECharts 图表与联动
           ===================================================================== */
        
        const statusChart = echarts.init(document.getElementById('statusChart'));
        const cityChart = echarts.init(document.getElementById('cityChart'));

        // 统计图表数据
        function buildChartData(data) {
            const statusCount = {};
            const cityCount = {};
            
            data.forEach(o => {
                statusCount[o.status] = (statusCount[o.status] || 0) + 1;
                cityCount[o.city] = (cityCount[o.city] || 0) + 1;
            });

            const statusData = Object.keys(statusCount).map(k => ({ name: k, value: statusCount[k] }));
            const cityData = Object.keys(cityCount)
                .map(k => ({ name: k, value: cityCount[k] }))
                .sort((a, b) => b.value - a.value);

            return { statusData, cityData };
        }

        let { statusData, cityData } = buildChartData(orders);

        // 渲染饼图
        function renderStatusChart(data) {
            statusChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c} 单 ({d}%)' },
                legend: { bottom: 0, itemWidth: 10, itemHeight: 10 },
                series: [{
                    type: 'pie',
                    radius: ['40%', '65%'],
                    center: ['50%', '45%'],
                    data: data.map(d => ({ ...d, itemStyle: { color: statusColors[d.name] } })),
                    label: { formatter: '{b}\n{c}单', fontSize: 11 }
                }]
            });
        }

        // 渲染柱状图
        function renderCityChart(data) {
            cityChart.setOption({
                tooltip: { trigger: 'axis' },
                grid: { left: '3%', right: '5%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: data.map(d => d.name), axisLabel: { rotate: 45, fontSize: 10 } },
                yAxis: { type: 'value', name: '订单数' },
                series: [{
                    type: 'bar',
                    data: data.map(d => d.value),
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#1890ff' },
                            { offset: 1, color: '#69c0ff' }
                        ]),
                        borderRadius: [4, 4, 0, 0]
                    },
                    label: { show: true, position: 'top', fontSize: 10 }
                }]
            });
        }

        renderStatusChart(statusData);
        renderCityChart(cityData);

        // 窗口大小变化自适应
        window.addEventListener('resize', () => {
            statusChart.resize();
            cityChart.resize();
        });

        // 监听：点击地图点 -> 高亮图表
        EventBus.on('order-click', (order) => {
            const statusIndex = statusData.findIndex(d => d.name === order.status);
            statusChart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: statusIndex });

            const cityIndex = cityData.findIndex(d => d.name === order.city);
            cityChart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: cityIndex });

            setTimeout(() => {
                statusChart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
                cityChart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
            }, 2000);
        });

        // 监听：点击柱状图 -> 地图飞入
        cityChart.on('click', (params) => {
            const cityName = params.name;
            const cityOrders = orders.filter(o => o.city === cityName);
            if (cityOrders.length === 0) return;

            const avgLat = cityOrders.reduce((s, o) => s + o.lat, 0) / cityOrders.length;
            const avgLng = cityOrders.reduce((s, o) => s + o.lng, 0) / cityOrders.length;

            map.flyTo([avgLat, avgLng], 9, { duration: 1.5 });
            L.popup()
                .setLatLng([avgLat, avgLng])
                .setContent(`<b>${cityName}</b><br/>共 ${cityOrders.length} 个订单`)
                .openOn(map);
        });


        /* =====================================================================
           4. 空间查询与标绘 (Leaflet.draw + Turf.js)
           ===================================================================== */
        
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        const drawControl = new L.Control.Draw({
            position: 'topleft',
            draw: {
                polygon: { shapeOptions: { color: '#ff4d4f', weight: 2 } },
                rectangle: { shapeOptions: { color: '#ff4d4f', weight: 2 } },
                polyline: false,
                circle: false,
                circlemarker: false,
                marker: false
            },
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        // 执行空间查询
        function doSpatialQuery(layer) {
            const drawnGeoJSON = layer.toGeoJSON();
            const insideOrders = orders.filter(order => {
                const pt = turf.point([order.lng, order.lat]);
                return turf.booleanPointInPolygon(pt, drawnGeoJSON);
            });

            const area = turf.area(drawnGeoJSON);
            const areaKm2 = (area / 1000000).toFixed(2);

            showQueryResult(insideOrders, areaKm2, layer);
            updateChartsByOrders(insideOrders);
        }

        // 绘制完成事件
        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            drawnItems.addLayer(layer);
            doSpatialQuery(layer);
        });

        // 图形编辑事件
        map.on(L.Draw.Event.EDITED, function (e) {
            e.layers.eachLayer(layer => doSpatialQuery(layer));
        });

        // 图形删除事件
        map.on(L.Draw.Event.DELETED, function () {
            if (window.highlightLayer) {
                map.removeLayer(window.highlightLayer);
                window.highlightLayer = null;
            }
            map.closePopup();
            const { statusData, cityData } = buildChartData(orders);
            renderStatusChart(statusData);
            renderCityChart(cityData);
        });

        // 展示查询结果
        function showQueryResult(orders, areaKm2, drawnLayer) {
            if (window.highlightLayer) {
                map.removeLayer(window.highlightLayer);
            }

            window.highlightLayer = L.layerGroup();
            orders.forEach(order => {
                const icon = L.divIcon({
                    className: 'highlight-marker',
                    html: `<div style="
                        background: #ff4d4f;
                        width: 18px; height: 18px;
                        border-radius: 50%;
                        border: 3px solid #fff;
                        box-shadow: 0 0 10px #ff4d4f;
                        animation: pulse 1s infinite;
                    "></div>`,
                    iconSize: [18, 18]
                });
                L.marker([order.lat, order.lng], { icon })
                    .bindPopup(`<b>${order.id}</b><br/>${order.customer}<br/>${order.city}`)
                    .addTo(window.highlightLayer);
            });
            window.highlightLayer.addTo(map);

            const bounds = drawnLayer.getBounds();
            const center = bounds.getCenter();
            L.popup({ maxWidth: 300 })
                .setLatLng(center)
                .setContent(`
                    <div style="font-family: 'Microsoft YaHei';">
                        <h4 style="margin: 0 0 8px 0; color: #ff4d4f;">📍 空间查询结果</h4>
                        <p style="margin: 4px 0;"><b>区域面积：</b>${areaKm2} 平方公里</p>
                        <p style="margin: 4px 0;"><b>命中订单：</b><span style="color: #ff4d4f; font-weight: bold;">${orders.length}</span> 单</p>
                        <p style="margin: 4px 0; font-size: 12px; color: #999;">点击图表可查看详细分布</p>
                    </div>
                `)
                .openOn(map);
        }

        // 根据查询结果更新图表
        function updateChartsByOrders(filteredOrders) {
            const { statusData, cityData } = buildChartData(filteredOrders);
            renderStatusChart(statusData);
            renderCityChart(cityData);
        }
    </script>
</body>
</html>
